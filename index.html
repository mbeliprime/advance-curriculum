<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>선행 커리큘럼 계산기</title><style>:root{font-family:system-ui,'Malgun Gothic',sans-serif;color:#172338;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1050px;margin:auto;padding:28px 16px 80px}h1{font-size:27px;margin:0 0 6px}h2{font-size:19px}p,.muted{color:#64748b}.panel,.subject,.range,.month{background:white;border:1px solid #e1e7ef;border-radius:14px;padding:18px;margin-top:16px}.range{background:#f7f9fc;margin:10px 0;padding:14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}label{font-size:13px;font-weight:650;display:block;margin-bottom:6px}input:not([type=checkbox]),select,textarea{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:9px;background:white;font:inherit;font-size:14px}textarea{min-height:145px}button{cursor:pointer;background:#2563eb;color:white;border:0;border-radius:10px;padding:12px 17px;font-size:15px;font-weight:650}button.secondary{background:white;color:#334155;border:1px solid #cbd5e1}button:hover{filter:brightness(.95)}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.top label{margin:0;display:flex;align-items:center;gap:8px}.top input{width:18px;height:18px}.row{margin-top:12px}.result{display:none}.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.metric{background:#f1f5f9;border-radius:10px;padding:13px}.metric strong{font-size:22px;display:block}.month{margin:10px 0}.month p{margin:7px 0;color:#334155}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.error{color:#b91c1c}.small{font-size:12px}.editpanel{margin-top:24px}.editpanel summary{cursor:pointer;font-size:19px;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center}.editpanel summary::-webkit-details-marker{display:none}.editpanel summary::after{content:"＋";font-size:24px;color:#2563eb}.editpanel[open] summary::after{content:"－"}.editpanel summary:focus-visible{outline:2px solid #2563eb;outline-offset:5px}.editpanel .editor-body{padding-top:10px}#status{color:#047857;font-size:13px}.hide{display:none}@media(max-width:650px){.grid,.three,.metrics{grid-template-columns:1fr}.wrap{padding:18px 12px}.panel,.subject{padding:14px}h1{font-size:23px}}</style></head><body><main class="wrap"><h1>📚 선행 커리큘럼 계산기</h1><p>초3~중3 교과 · 사고력 교재별 진도 · 월별 입시 대비 목표</p><section class="panel"><label for="heading">상담 목표명</label><input id="heading" value="영재교육원 입시 대비"></section><div id="subjects"></div><section class="panel"><h2>입시 및 학습 일정</h2><div class="grid"><div><label for="startDate">학습 시작일</label><input type="date" id="startDate" value="2026-10-13"></div><div><label for="examDate">입시 예정일</label><input type="date" id="examDate" value="2026-12-05"></div></div><div class="row"><label for="finishDate">선행 완료 목표일</label><input type="date" id="finishDate" value="2026-11-30"><p class="small">입시일보다 먼저 선행을 마치면 남은 기간을 복습에 활용할 수 있어요.</p></div><button id="calculate">월별 선행 목표 계산하기</button><p id="error" class="error"></p></section><section id="result" class="panel result"><h2>선행 학습 계산 결과</h2><div id="metrics" class="metrics"></div><h2>월별 마무리 목표</h2><div id="months"></div><div class="actions"><button id="copy" class="secondary">📋 상담용 목표 문구 복사</button><button id="print" class="secondary">🖨️ 인쇄하기</button></div><p id="status"></p></section><details class="panel editpanel"><summary>⚙️ 단원명 직접 수정 <span class="small muted">눌러서 펼치기</span></summary><div class="editor-body"><p class="small">교재별 세부 목차가 확인되지 않은 단원은 번호로 표시됩니다. 교재의 실제 목차를 한 줄에 하나씩 입력하여 수정할 수 있어요. 변경 내용은 이 브라우저에 저장됩니다.</p><div class="three"><div><label>영역</label><select id="editSubject"></select></div><div><label>교재</label><select id="editBook"></select></div><div><label>학년·단계</label><select id="editGroup"></select></div></div><div class="row"><label>학기·권·과정</label><select id="editSection"></select></div><div class="row"><label>단원명 (한 줄에 하나씩)</label><textarea id="editText"></textarea></div><div class="actions"><button id="saveEdit">단원명 저장</button><button id="resetEdit" class="secondary">현재 과정 기본값 복원</button></div><p id="editStatus" class="small"></p></div></details></main><script>
const gradeTerms=['초3','초4','초5','초6','중1','중2','중3'];
const mathCounts=[[6,6],[6,6],[6,6],[6,6],[4,4],[5,5],[4,3]];
const mathNames=[['덧셈과 뺄셈','평면도형','나눗셈','곱셈','길이와 시간','분수와 소수'],['곱셈','나눗셈','원','분수','들이와 무게','자료의 정리'],['큰 수','각도','곱셈과 나눗셈','평면도형의 이동','막대그래프','규칙 찾기'],['분수의 덧셈과 뺄셈','삼각형','소수의 덧셈과 뺄셈','사각형','꺾은선그래프','다각형'],['자연수의 혼합 계산','약수와 배수','대응 관계','약분과 통분','분수의 덧셈과 뺄셈','다각형의 둘레와 넓이'],['수의 범위와 어림하기','분수의 곱셈','합동과 대칭','소수의 곱셈','직육면체','평균과 가능성'],['분수의 나눗셈','각기둥과 각뿔','소수의 나눗셈','비와 비율','여러 가지 그래프','직육면체의 부피와 겉넓이'],['분수의 나눗셈','소수의 나눗셈','공간과 입체','비례식과 비례배분','원의 넓이','원기둥·원뿔·구'],['소인수분해','정수와 유리수','문자와 식','좌표평면과 그래프'],['기본 도형','평면도형','입체도형','통계'],['유리수와 순환소수','식의 계산','일차부등식','연립일차방정식','일차함수'],['삼각형의 성질','사각형의 성질','도형의 닮음','피타고라스 정리','확률'],['실수와 그 계산','다항식의 곱셈과 인수분해','이차방정식','이차함수'],['삼각비','원의 성질','통계']];
const scienceNames=[['물체의 성질','동물의 한살이','자석의 이용','지구의 모습'],['동물의 생활','지표의 변화','물질의 상태','소리의 성질'],['지층과 화석','식물의 한살이','물체의 무게','혼합물의 분리'],['식물의 생활','물의 상태 변화','그림자와 거울','화산과 지진'],['과학 탐구','온도와 열','태양계와 별','용해와 용액'],['생물과 환경','날씨와 우리 생활','물체의 운동','산과 염기'],['지구와 달의 운동','여러 가지 기체','식물의 구조와 기능','빛과 렌즈'],['전기의 이용','계절의 변화','연소와 소화','우리 몸의 구조와 기능'],['과학과 인류의 지속가능한 삶','생물의 구성과 다양성','열','물질의 상태 변화'],['힘의 작용','기체의 성질','태양계','빛과 파동'],['물질의 특성','지권의 변화','전기와 자기','생식과 유전'],['화학 반응의 규칙','동물과 에너지','수권과 해수의 순환','파동'],['화학 반응의 규칙과 에너지 변화','기권과 날씨','운동과 에너지','자극과 반응'],['생식과 유전','별과 우주','과학기술과 인류 문명','재해·재난과 안전']];
const defs={math:{name:'교과 수학',books:[{name:'교과 수학',groups:gradeTerms.map((name,i)=>({name,sections:['1학기','2학기'].map((s,j)=>({name:s,count:mathCounts[i][j],names:mathNames[i*2+j]}))}))}]},science:{name:'교과 과학',books:[{name:'교과 과학',groups:gradeTerms.map((name,i)=>({name,sections:['1학기','2학기'].map((s,j)=>({name:s,count:4,names:scienceNames[i*2+j]}))}))}]},thinkMath:{name:'사고력 수학',books:[{name:'필즈수학',groups:['초급','중급','고급'].map(name=>({name,sections:['상','하'].map(s=>({name:s,count:15}))}))},{name:'1031 수학',groups:['입문','초급','중급','고급'].map(name=>({name,sections:['A','B','C','D'].map(s=>({name:s,count:10}))}))}]},thinkScience:{name:'사고력 과학',books:[{name:'안쌤의 최상위 줄기과학',groups:['초3','초4','초5','초6'].map(name=>({name,sections:['1학기','2학기'].map(s=>({name:s,count:8}))}))},{name:'1031 과학',groups:['초3','초4','초5','초6'].map(name=>({name,sections:['개념심화','창의탐구'].map(s=>({name:s,count:8}))}))},{name:'안쌤의 STEAM+ 창의사고력 100제',groups:['초3','초4','초5','초6'].map(name=>({name,sections:[{name:'전체 과정',count:50,unit:'강'}]}))}]}};
const keys=Object.keys(defs);const cfg={math:{on:true,book:0,from:[3,1,4],to:[5,1,5]},science:{on:true,book:0,from:[3,1,0],to:[5,1,3]},thinkMath:{on:false,book:0,from:[0,0,0],to:[2,1,14]},thinkScience:{on:false,book:0,from:[0,0,0],to:[3,1,7]}};
let edits={};try{edits=JSON.parse(localStorage.getItem('advanceCurriculumEditsV1')||'{}')}catch{};
const $=id=>document.getElementById(id);const opt=(label,value)=>{let o=document.createElement('option');o.textContent=label;o.value=value;return o};const select=(items,value,callback)=>{const el=document.createElement('select');items.forEach((it,i)=>el.add(opt(it.name??it,String(i))));el.value=String(value);el.onchange=()=>callback(+el.value);return el};const field=(title,el)=>{const d=document.createElement('div'),l=document.createElement('label');l.textContent=title;d.append(l,el);return d};
function getUnits(k,b){return defs[k].books[b].groups.flatMap((g,gi)=>g.sections.flatMap((s,si)=>Array.from({length:s.count},(_,ui)=>({g:gi,s:si,u:ui,unit:s.unit||'단원',short:`${g.name} ${s.name} ${ui+1}${s.unit||'단원'}`,name:edits[`${k}:${b}:${gi}:${si}:${ui}`]||s.names?.[ui]||`${ui+1}${s.unit||'단원'}`}))))}function unitIndex(units,arr){return units.findIndex(x=>x.g===arr[0]&&x.s===arr[1]&&x.u===arr[2])}
function renderSubjects(){const root=$('subjects');root.replaceChildren();keys.forEach(k=>{const c=cfg[k],def=defs[k],card=document.createElement('section');card.className='subject';const top=document.createElement('div');top.className='top';const h=document.createElement('h2');h.textContent=def.name;h.style.margin='0';const toggle=document.createElement('label');const cb=document.createElement('input');cb.type='checkbox';cb.checked=c.on;cb.onchange=()=>{c.on=cb.checked;renderSubjects()};toggle.append(cb,document.createTextNode('포함'));top.append(h,toggle);card.append(top);if(c.on){if(def.books.length>1){const bs=select(def.books,c.book,n=>{c.book=n;c.from=[0,0,0];c.to=[0,0,0];renderSubjects()});const w=field('교재 선택',bs);w.className='row';card.append(w)}['from','to'].forEach(side=>{const group=def.books[c.book].groups[c[side][0]],sec=group.sections[c[side][1]],box=document.createElement('div');box.className='range';const h3=document.createElement('strong');h3.textContent=side==='from'?'현재 학습 중인 단원':'최종 목표 단원';box.append(h3);const grade=select(def.books[c.book].groups,c[side][0],n=>{c[side]=[n,0,0];renderSubjects()});const first=field(k==='thinkMath'?'단계':'학년',grade);first.className='row';box.append(first);const duo=document.createElement('div');duo.className='grid row';const semester=select(group.sections,c[side][1],n=>{c[side]=[c[side][0],n,0];renderSubjects()});duo.append(field(k==='thinkMath'?'권':'학기 / 과정',semester));const count=Array.from({length:sec.count},(_,i)=>({name:`${i+1}${sec.unit||'단원'}${(edits[`${k}:${c.book}:${c[side][0]}:${c[side][1]}:${i}`]||sec.names?.[i])?' · '+(edits[`${k}:${c.book}:${c[side][0]}:${c[side][1]}:${i}`]||sec.names[i]):''}`}));const unit=select(count,c[side][2],n=>{c[side][2]=n});duo.append(field(sec.unit==='강'?'강':'단원',unit));box.append(duo);card.append(box)})}root.append(card)})}
const parseDate=s=>new Date(s+'T12:00:00');const day=86400000;let reportText='';function calculate(){const start=$('startDate').value,finish=$('finishDate').value,exam=$('examDate').value;const days=Math.round((parseDate(finish)-parseDate(start))/day)+1;const active=keys.filter(k=>cfg[k].on);$('error').textContent='';$('result').style.display='none';if(!start||!finish||!exam||days<=0||finish>exam||!active.length){$('error').textContent='학습 시작일·선행 완료일·입시일의 순서와 선택한 영역을 확인해 주세요.';return}const results=active.map(k=>{const c=cfg[k],units=getUnits(k,c.book),si=unitIndex(units,c.from),ei=unitIndex(units,c.to),chosen=si>=0&&ei>=si?units.slice(si,ei+1):[],months=[];let cursor=new Date(parseDate(start).getFullYear(),parseDate(start).getMonth(),1);const last=parseDate(finish),begin=parseDate(start);while(cursor<=last&&months.length<60){const end=new Date(Math.min(new Date(cursor.getFullYear(),cursor.getMonth()+1,0,12).getTime(),last.getTime()));const elapsed=Math.max(0,Math.min(days,Math.round((end-begin)/day)+1));const n=Math.min(chosen.length,Math.ceil(chosen.length*elapsed/days));months.push({key:`${cursor.getFullYear()}-${String(cursor.getMonth()+1).padStart(2,'0')}`,goal:n?chosen[n-1].short:'복습 및 기초 점검'});cursor=new Date(cursor.getFullYear(),cursor.getMonth()+1,1)}return {k,book:defs[k].books[c.book].name,chosen,months,weekly:chosen.length*7/days,valid:si>=0&&ei>=si}});if(results.some(r=>!r.valid)){$('error').textContent='목표 단원은 현재 학습 중인 단원과 같거나 뒤에 있어야 합니다.';return}const metrics=$('metrics');metrics.replaceChildren();results.forEach(r=>{const d=document.createElement('div');d.className='metric';const small=document.createElement('div');small.className='small';small.textContent=`${defs[r.k].name} · ${r.book}`;const big=document.createElement('strong');big.textContent=`${r.chosen.length}${r.chosen[0].unit}`;const weekly=document.createElement('div');weekly.className='small';weekly.textContent=`주당 약 ${r.weekly.toFixed(1)}개`;d.append(small,big,weekly);metrics.append(d)});const monthKeys=[...new Set(results.flatMap(r=>r.months.map(m=>m.key)))].sort();const months=$('months');months.replaceChildren();monthKeys.forEach(m=>{const box=document.createElement('div');box.className='month';const h=document.createElement('strong');h.textContent=`${m.slice(0,4)}년 ${Number(m.slice(5))}월`;box.append(h);results.forEach(r=>{const p=document.createElement('p');p.textContent=`${defs[r.k].name} (${r.book}): ${r.months.find(x=>x.key===m)?.goal}까지 마무리`;box.append(p)});months.append(box)});reportText=[`${$('heading').value} | 월별 선행 커리큘럼`,`학습 기간: ${start} ~ ${finish}`,`입시 예정일: ${exam}`,...results.map(r=>`${defs[r.k].name} (${r.book}): ${r.chosen[0].short}부터 ${r.chosen.at(-1).short}까지 / 총 ${r.chosen.length}${r.chosen[0].unit} / 주당 약 ${r.weekly.toFixed(1)}개`),...monthKeys.map(m=>`${m.slice(0,4)}년 ${Number(m.slice(5))}월 목표\n${results.map(r=>`- ${defs[r.k].name}: ${r.months.find(x=>x.key===m)?.goal}까지 마무리`).join('\n')}`)].join('\n');$('result').style.display='block';$('result').scrollIntoView({behavior:'smooth',block:'start'})}
$('calculate').onclick=calculate;$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(reportText);$('status').textContent='상담용 문구를 복사했어요.'}catch{const t=document.createElement('textarea');t.value=reportText;document.body.append(t);t.select();document.execCommand('copy');t.remove();$('status').textContent='상담용 문구 복사를 시도했어요.'}};$('print').onclick=()=>window.print();
function populate(sel,items,selected=0){sel.replaceChildren();items.forEach((x,i)=>sel.add(opt(x.name??x,i)));sel.value=String(selected)}function renderEditor(level=0){const k=keys[+$('editSubject').value||0];if(level<=0)populate($('editBook'),defs[k].books);const b=+$('editBook').value||0;if(level<=1)populate($('editGroup'),defs[k].books[b].groups);const g=+$('editGroup').value||0;if(level<=2)populate($('editSection'),defs[k].books[b].groups[g].sections);const s=+$('editSection').value||0;const sec=defs[k].books[b].groups[g].sections[s];$('editText').value=Array.from({length:sec.count},(_,i)=>edits[`${k}:${b}:${g}:${s}:${i}`]||sec.names?.[i]||`${i+1}${sec.unit||'단원'}`).join('\n');$('editStatus').textContent=''}populate($('editSubject'),keys.map(k=>({name:defs[k].name})),2);$('editSubject').onchange=()=>renderEditor(0);$('editBook').onchange=()=>renderEditor(1);$('editGroup').onchange=()=>renderEditor(2);$('editSection').onchange=()=>renderEditor(3);$('saveEdit').onclick=()=>{const k=keys[+$('editSubject').value],b=+$('editBook').value,g=+$('editGroup').value,s=+$('editSection').value,sec=defs[k].books[b].groups[g].sections[s],lines=$('editText').value.split('\n').map(x=>x.trim());if(lines.length!==sec.count||lines.some(x=>!x)){$('editStatus').textContent=`정확히 ${sec.count}개 항목을 한 줄에 하나씩 입력해 주세요.`;return}lines.forEach((line,i)=>edits[`${k}:${b}:${g}:${s}:${i}`]=line);localStorage.setItem('advanceCurriculumEditsV1',JSON.stringify(edits));$('editStatus').textContent='저장했어요. 계산기에 반영됩니다.';renderSubjects()};$('resetEdit').onclick=()=>{const k=keys[+$('editSubject').value],b=+$('editBook').value,g=+$('editGroup').value,s=+$('editSection').value,sec=defs[k].books[b].groups[g].sections[s];for(let i=0;i<sec.count;i++)delete edits[`${k}:${b}:${g}:${s}:${i}`];localStorage.setItem('advanceCurriculumEditsV1',JSON.stringify(edits));renderEditor(3);renderSubjects();$('editStatus').textContent='기본값으로 복원했어요.'};renderSubjects();renderEditor(0);
</script></body></html>
